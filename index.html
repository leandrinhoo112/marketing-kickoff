<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Diário | Daily Team Sync</title>
    <meta name="description" content="App de Kickoff diário para times de marketing. Organize suas tarefas, compartilhe progressos e peça ajuda de forma eficiente.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6841f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="background-blob"></div>
    <div class="background-blob blob-2"></div>
    
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; gap: 20px;">
            <div class="logo" style="flex: 1; margin-bottom: 0;">
                <i data-lucide="activity"></i>
                <span>Radar<span>Diário</span></span>
            </div>
            <div style="flex: 1; display: flex; justify-content: center;">
                <img src="Logo-Faculdade-Inspirar-4.png" alt="Inspirar Logo" style="height: 80px; filter: drop-shadow(0 0 10px rgba(104, 65, 241, 0.3));">
            </div>
            <div class="date-display" id="currentDate" style="flex: 1; text-align: right; font-weight: 600; opacity: 0.8; font-size: 1em; color: #8e6eff;"></div>
        </div>
    </header>

    <main class="container">
        <!-- SAUDAÇÃO E PRESENÇA -->
        <section class="greeting-section" style="margin-bottom: 30px; text-align: center;">
            <h2 id="dynamicGreeting" style="font-size: 1.8em; margin-bottom: 10px; font-weight: 800; background: linear-gradient(to right, #fff, #8e6eff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Bom dia, Time! 🚀</h2>
            <div id="presenceBar" style="display: flex; justify-content: center; gap: -10px; margin-top: 15px;">
                <!-- Avatares de quem já postou hoje entrarão aqui -->
            </div>
        </section>
        <!-- BARRA DE BUSCA E FILTRO -->
        <div class="filters-container" style="margin-bottom: 40px; display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
            <div class="search-wrapper" style="position: relative;">
                <i data-lucide="search" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); opacity: 0.5;"></i>
                <input type="text" id="searchInput" placeholder="O que você está procurando no feed hoje? (nome ou tarefa)" style="padding-left: 55px; height: 60px; font-size: 1.1em; background: rgba(255,255,255,0.05); border-radius: 15px; width: 100%;">
            </div>
            <div class="date-filter-wrapper" style="position: relative;">
                <i data-lucide="filter" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); opacity: 0.5; pointer-events: none;"></i>
                <select id="dateFilter" style="padding-left: 55px; height: 60px; font-size: 1.1em; background: #1a152e; border-radius: 15px; width: 100%; color: white; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; appearance: none; color-scheme: dark;">
                    <option value="all" style="background: #1a152e;">📅 Todos os registros</option>
                    <option value="today" style="background: #1a152e;">Hoje</option>
                    <option value="yesterday" style="background: #1a152e;">Ontem</option>
                    <option value="beforeYesterday" style="background: #1a152e;">Anteontem</option>
                    <option value="thisWeek" style="background: #1a152e;">Esta Semana</option>
                    <option value="thisMonth" style="background: #1a152e;">Este Mês</option>
                    <option value="custom" style="background: #1a152e;">📅 Escolher data específica...</option>
                </select>
                <input type="date" id="customDateInput" style="display: none; margin-top: 10px; height: 60px; font-size: 1.1em; background: #1a152e; border-radius: 15px; width: 100%; color: white; border: 1px solid var(--primary); padding: 0 20px; color-scheme: dark;">
            </div>
        </div>
        <!-- DASHBOARD DE ESTATÍSTICAS -->
        <section class="stats-dashboard" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 40px;">
            <div class="glass-card" style="padding: 20px; margin-bottom: 0; text-align: center; border-bottom: 3px solid #6841f1;">
                <h3 id="statTotal" style="font-size: 2em; margin-bottom: 5px;">0</h3>
                <p style="font-size: 0.8em; opacity: 0.6; text-transform: uppercase;">Check-ins Hoje</p>
            </div>
            <div class="glass-card" style="padding: 20px; margin-bottom: 0; text-align: center; border-bottom: 3px solid #02ceff;">
                <h3 id="statHelp" style="font-size: 2em; margin-bottom: 5px; color: #02ceff;">0</h3>
                <p style="font-size: 0.8em; opacity: 0.6; text-transform: uppercase;">Pedidos de Ajuda</p>
            </div>
            <div class="glass-card" style="padding: 20px; margin-bottom: 0; text-align: center; border-bottom: 3px solid #ff416c;">
                <h3 id="statBlockers" style="font-size: 2em; margin-bottom: 5px; color: #ff416c;">0</h3>
                <p style="font-size: 0.8em; opacity: 0.6; text-transform: uppercase;">Impedimentos</p>
            </div>
        </section>

        <section class="form-section">
            <div class="glass-card">
                <div class="card-header">
                    <h2>Novo Check-in Diário</h2>
                    <p>Preencha suas metas e atualizações para o dia de hoje.</p>
                </div>
                
                <form id="kickoffForm">
                    <div class="grid-2">
                        <div class="input-group">
                            <label for="userName"><i data-lucide="user"></i> Nome Completo</label>
                            <input type="text" id="userName" name="userName" placeholder="Seu nome" required>
                        </div>
                        <div class="input-group">
                            <label for="userColor"><i data-lucide="palette"></i> Cor do Perfil</label>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <input type="color" id="userColor" value="#6841f1" style="width: 100%; height: 45px; padding: 5px; cursor: pointer; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
                            </div>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="input-group">
                            <label for="yesterdayTasks"><i data-lucide="check-circle"></i> O que foi concluído ontem?</label>
                            <textarea id="yesterdayTasks" name="yesterdayTasks" placeholder="Liste as tarefas finalizadas..." required></textarea>
                        </div>
                        <div class="input-group">
                            <label for="todayTasks"><i data-lucide="target"></i> O que você fará hoje?</label>
                            <textarea id="todayTasks" name="todayTasks" placeholder="Quais são as metas para hoje?" required></textarea>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="input-group">
                            <label for="helpNeeded"><i data-lucide="help-circle"></i> Precisa de ajuda com algo?</label>
                            <textarea id="helpNeeded" name="helpNeeded" placeholder="Descreva onde o progresso travou..."></textarea>
                        </div>
                        <div class="input-group">
                            <label for="whoHelp"><i data-lucide="users"></i> De quem você precisa de ajuda?</label>
                            <input type="text" id="whoHelp" name="whoHelp" placeholder="Nome do colega ou time">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="blockers"><i data-lucide="alert-triangle"></i> Algo impedindo o seu progresso? (Deixe em branco se não houver)</label>
                        <textarea id="blockers" name="blockers" placeholder="Ex: Aguardando aprovação, problema técnico..."></textarea>
                    </div>

                    <div class="input-group">
                        <label for="observations"><i data-lucide="message-square"></i> Observações Diárias</label>
                        <textarea id="observations" name="observations" placeholder="Algo mais que o time precise saber?"></textarea>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button type="submit" class="btn-primary" style="flex: 2;">
                            Enviar Radar <i data-lucide="send"></i>
                        </button>
                        <button type="button" id="testTeamsBtn" class="btn-secondary" style="flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; cursor: pointer; transition: all 0.3s ease;">
                            Testar Teams <i data-lucide="zap"></i>
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section class="history-section">
            <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h3 style="margin-bottom: 0;"><i data-lucide="list"></i> Feed da Equipe</h3>
                <button id="copySummaryBtn" class="btn-secondary" style="background: rgba(104, 65, 241, 0.1); border: 1px solid rgba(104, 65, 241, 0.3); color: #8e6eff; padding: 8px 16px; border-radius: 8px; font-size: 0.85em; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s;">
                    <i data-lucide="copy"></i> Copiar Resumo do Dia
                </button>
            </div>
            <div id="kickoffList" class="kickoff-list">
                <!-- Entries will be loaded here -->
                <div class="empty-state">
                    <i data-lucide="calendar"></i>
                    <p>Nenhum registro hoje. Seja o primeiro!</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <img src="Logo-Faculdade-Inspirar-4.png" alt="Faculdade Inspirar" style="height: 60px; margin-bottom: 15px; filter: brightness(0) invert(1);">
            <p>&copy; 2026 Radar Diário • Desenvolvido pelo Leandro Campeão 🏆</p>
        </div>
    </footer>

    <script src="app.js?v=1.2"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
