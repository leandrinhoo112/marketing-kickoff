<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Galeria de Silhuetas - O Meu É Maior</title>
    <style>
        body {
            background-color: #0b071a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .search-box {
            max-width: 500px;
            margin: 0 auto 32px;
            display: flex;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #1e1738;
            color: white;
            font-size: 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }
        .card {
            background: rgba(30, 23, 56, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }
        .svg-container {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .svg-container svg {
            max-width: 100%;
            max-height: 100%;
        }
        .name {
            font-weight: 600;
            font-size: 13px;
            line-height: 1.3;
            margin-bottom: 6px;
        }
        .size {
            color: #a855f7;
            font-size: 12px;
            font-weight: 500;
        }
        .id {
            color: #64748b;
            font-size: 10px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <h1>Galeria de Silhuetas: O MEU É MAIOR</h1>
    <p class="subtitle">540 itens reais com silhuetas vetoriais SVG de alta fidelidade</p>
    <div class="search-box">
        <input type="text" id="filter" placeholder="Filtrar por nome, categoria ou ID..." oninput="filterItems()">
    </div>
    <div class="grid" id="items-grid"></div>

    <script src="o-meu-e-maior-items.js"></script>
    <script>
        const grid = document.getElementById('items-grid');
        function render(list) {
            grid.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="svg-container">${item.svg}</div>
                    <div class="name">${item.name}</div>
                    <div class="size">${item.display}</div>
                    <div class="id">${item.id}</div>
                `;
                grid.appendChild(card);
            });
        }
        render(window.SIZE_IT_UP_ITEMS || []);

        function filterItems() {
            const q = document.getElementById('filter').value.toLowerCase();
            const filtered = (window.SIZE_IT_UP_ITEMS || []).filter(it => 
                it.name.toLowerCase().includes(q) || 
                it.id.toLowerCase().includes(q) || 
                it.category.toLowerCase().includes(q)
            );
            render(filtered);
        }
    </script>
</body>
</html>
